{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - KAELA Resort</title>
    <link rel="stylesheet" href="{% static 'blossom.css' %}">
    <style>
        body {
            background: linear-gradient(135deg, var(--kaela-brown) 0%, var(--kaela-terracotta) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem 0;
        }

        .auth-container {
            width: 100%;
            max-width: 500px;
            padding: 2rem;
        }

        .auth-card {
            background: var(--text-white);
            border-radius: 12px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .auth-header {
            background: var(--kaela-brown);
            color: var(--text-white);
            padding: 2.5rem;
            text-align: center;
        }

        .auth-header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
        }

        .auth-header .logo-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            margin: 0.5rem 0 0 0;
            font-size: 0.9rem;
            opacity: 0.95;
        }

        .auth-body {
            padding: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-row .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.6rem;
            color: var(--kaela-brown);
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--kaela-brown);
            box-shadow: 0 0 0 4px rgba(168, 92, 60, 0.1);
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            border-left: 5px solid #dc3545;
            font-size: 0.95rem;
        }

        .error-message ul {
            margin: 0;
            padding-left: 1.5rem;
        }

        .error-message li {
            margin-bottom: 0.5rem;
        }

        .error-message li:last-child {
            margin-bottom: 0;
        }

        .signup-btn {
            width: 100%;
            padding: 0.9rem;
            background: var(--kaela-brown);
            color: var(--text-white);
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .signup-btn:hover {
            background: var(--kaela-dark-brown);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(168, 92, 60, 0.3);
        }

        .auth-footer {
            padding: 0 2.5rem 2.5rem 2.5rem;
            text-align: center;
            border-top: 1px solid #f0f0f0;
        }

        .auth-footer p {
            color: var(--text-dark);
            margin: 0 0 1rem 0;
            font-size: 0.95rem;
        }

        .auth-footer a {
            color: var(--kaela-brown);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .auth-footer a:hover {
            color: var(--kaela-terracotta);
            text-decoration: underline;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }

        .button-group a {
            display: inline-block;
            padding: 0.8rem;
            text-align: center;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .button-group a.btn-secondary {
            background: #e0e0e0;
            color: var(--text-dark);
        }

        .button-group a.btn-secondary:hover {
            background: #d0d0d0;
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <img src="{% static 'KALEA LOGO.png' %}" alt="KAELA Logo" class="logo-img">
                <h1>Create Account</h1>
                <p>Join KAELA and start booking</p>
            </div>

            <div class="auth-body">
                {% if errors %}
                    <div class="error-message">
                        <ul>
                            {% for error in errors %}
                                <li>{{ error }}</li>
                            {% endfor %}
                        </ul>
                    </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="first_name">First Name</label>
                            <input type="text" id="first_name" name="first_name" placeholder="First name">
                        </div>

                        <div class="form-group">
                            <label for="last_name">Last Name</label>
                            <input type="text" id="last_name" name="last_name" placeholder="Last name">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="username">Username <span style="color: #dc3545;">*</span></label>
                        <input type="text" id="username" name="username" required placeholder="Choose a username">
                    </div>

                    <div class="form-group">
                        <label for="email">Email <span style="color: #dc3545;">*</span></label>
                        <input type="email" id="email" name="email" required placeholder="your@email.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Password <span style="color: #dc3545;">*</span></label>
                        <input type="password" id="password" name="password" required placeholder="At least 6 characters">
                    </div>

                    <div class="form-group">
                        <label for="password_confirm">Confirm Password <span style="color: #dc3545;">*</span></label>
                        <input type="password" id="password_confirm" name="password_confirm" required placeholder="Confirm your password">
                    </div>

                    <button type="submit" class="signup-btn">Create Account</button>
                </form>
            </div>

            <div class="auth-footer">
                <p>Already have an account?</p>
                <a href="{% url 'user_login' %}">Login here</a>
                <div class="button-group">
                    <a href="{% url 'index' %}" class="btn-secondary">Back to Home</a>
                </div>
                <p style="margin-top: 1rem; font-size: 0.85rem;">Or <a href="{% url 'user_login' %}">login</a></p>
            </div>
        </div>
    </div>
</body>
</html>
